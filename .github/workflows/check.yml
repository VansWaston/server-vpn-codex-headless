name: portable-toolkit
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y screen util-linux
      - run: python -m pip install PyYAML
      - name: Install checksum-verified test core
        run: MIHOMO_ROOT="$RUNNER_TEMP/test-mihomo" bash mihomo-server/scripts/install-core.sh
      - name: Check scripts and isolated lifecycles
        run: MIHOMO_TEST_BIN="$RUNNER_TEMP/test-mihomo/bin/mihomo" bash scripts/check.sh
      - run: bash scripts/package.sh
